name: dpi-ch tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: ru/dpi-ch/go.mod
          cache-dependency-path: ru/dpi-ch/go.sum

      - name: Test
        working-directory: ru/dpi-ch
        run: go test ./...

      - name: Build
        working-directory: ru/dpi-ch
        run: go build ./...
