name: dpi-ch lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: ru/dpi-ch/go.mod
          cache-dependency-path: ru/dpi-ch/go.sum

      - name: Check formatting
        working-directory: ru/dpi-ch
        run: test -z "$(gofmt -l .)"

      - name: Vet
        working-directory: ru/dpi-ch
        run: go vet ./...
